import org.apache.tools.ant.filters.ReplaceTokens

import java.text.SimpleDateFormat

plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'maven-publish'
}

def getGitCommitHash() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        println("Git Failed,please check git" + e)
        return generateRandomHash()
    }
}

def static generateRandomHash() {
    def letters = "abcdefghijklmnopqrstuvwxyz"
    def digits = "0123456789"
    def hash = ""

    hash += letters.charAt((int) (Math.random() * letters.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))
    hash += letters.charAt((int) (Math.random() * letters.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))
    hash += letters.charAt((int) (Math.random() * letters.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))
    hash += letters.charAt((int) (Math.random() * letters.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))

    return hash
}

def static getCurrentDate() {
    def date = new Date()
    def dateFormat = new SimpleDateFormat("yyyyMMdd")
    return dateFormat.format(date)
}

group = 'top.mc_plfd_host'

if (project."complex-package-version".toBoolean()) {
    version = project."package-version" + "-" + project."package-type" + "-" + getCurrentDate() + getGitCommitHash()
} else {
    version = project."package-version"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT")
}

tasks {
  runServer {
    minecraftVersion("1.21.11")
  }
}

tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from javadoc
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}


def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [
            version: version,
            gva: project.property('gva'),
            uu: project.property('uu'),
            fva: project.property('fva')
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    filter(ReplaceTokens, tokens: props)
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from(components["java"])
            artifact(tasks.javadocJar)
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/${System.getenv("GITHUB_REPOSITORY")  ?: "OWNER/REPO"}")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}